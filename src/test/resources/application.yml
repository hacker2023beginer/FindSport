# Тестовая конфигурация: изолированный PostgreSQL 17 в Testcontainers (ТЗ п. 6.7).
# Параметры подключения подставляет @ServiceConnection (см. TestcontainersConfiguration),
# поэтому секция datasource здесь не нужна. Требуется запущенный Docker.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Europe/Minsk

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB

  jackson:
    time-zone: Europe/Minsk

findsport:
  uploads:
    image-min-size: 100KB
    image-max-size: 5MB
    document-max-size: 20MB

# Документация API (ТЗ п. 4.1.3, 4.4.5)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
