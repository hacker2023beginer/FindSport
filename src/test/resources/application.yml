# Тестовая конфигурация: in-memory H2 в режиме совместимости с PostgreSQL,
# чтобы smoke-тест контекста не требовал запущенного Docker.
# Интеграционные тесты бизнес-логики — на Testcontainers (ТЗ п. 6.7).

spring:
  datasource:
    url: jdbc:h2:mem:findsport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Europe/Minsk
