# Шаблон конфигурации FindSport (без секретов).
# Для локального запуска:  cp application-example.yml application.yml
# и укажите реальные значения через переменные окружения или прямо в копии.
# Секреты никогда не коммитятся в репозиторий (ТЗ п. 4.13.8).

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # В промышленной среде — true: только HTTPS (ТЗ п. 4.1.14, 4.13.9)
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: findsport

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findsport}
    username: ${DB_USERNAME:findsport}
    password: ${DB_PASSWORD:<your-password>}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Страховка от N+1 для ленивых коллекций, не попавших в entity graph
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Europe/Minsk

  servlet:
    multipart:
      # Чуть выше лимита документа: точные пределы проверяет валидатор (findsport.uploads)
      max-file-size: 21MB
      max-request-size: 22MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    # Локально — Mailpit из docker-compose (веб-интерфейс писем: http://localhost:8025)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Недоступность почты не должна подвешивать запросы (ТЗ п. 4.2.16)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  jackson:
    time-zone: Europe/Minsk

# Документация API (ТЗ п. 4.1.3, 4.4.5)
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    # Swagger UI передает CSRF-токен из cookie XSRF-TOKEN
    csrf:
      enabled: true

# Ограничения файлов (ТЗ п. 4.11.6, 4.12.6); настраиваются администратором
findsport:
  uploads:
    image-min-size: 100KB
    image-max-size: 5MB
    document-max-size: 20MB
  # Регистрация, вход и восстановление доступа (ТЗ п. 4.2.2–4.2.4, 4.2.14)
  auth:
    max-failed-logins: 5
    lockout-duration: 15m
    admin-session-timeout: 30m
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    # Адрес веб-интерфейса для ссылок в письмах
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    mail-from: ${MAIL_FROM:no-reply@findsport.by}
    public-forms:
      max-requests: 5
      window: 1m
      block: 1h
  # Первичный администратор создается при старте, если заданы оба значения
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    by.findsport: INFO
