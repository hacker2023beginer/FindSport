# Шаблон конфигурации FindSport (без секретов).
# Для локального запуска:  cp application-example.yml application.yml
# и укажите реальные значения через переменные окружения или прямо в копии.
# Секреты никогда не коммитятся в репозиторий (ТЗ п. 4.13.8).

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: findsport

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findsport}
    username: ${DB_USERNAME:findsport}
    password: ${DB_PASSWORD:<your-password>}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Страховка от N+1 для ленивых коллекций, не попавших в entity graph
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Europe/Minsk

  servlet:
    multipart:
      # Чуть выше лимита документа: точные пределы проверяет валидатор (findsport.uploads)
      max-file-size: 21MB
      max-request-size: 22MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    time-zone: Europe/Minsk

# Документация API (ТЗ п. 4.1.3, 4.4.5)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json

# Ограничения файлов (ТЗ п. 4.11.6, 4.12.6); настраиваются администратором
findsport:
  uploads:
    image-min-size: 100KB
    image-max-size: 5MB
    document-max-size: 20MB

logging:
  level:
    by.findsport: INFO
