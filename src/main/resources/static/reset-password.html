<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый пароль — FindSport</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/account.html"><span class="logo-mark">F.</span><span class="logo-text">Find<span>Sport</span></span></a><nav><a href="/login.html">Вход</a><a href="/register.html">Регистрация</a></nav></div></header>
<main class="auth">
    <h1>Новый пароль</h1>
    <div class="card">
        <div id="alert" class="alert hidden" role="alert"></div>
        <form id="form" novalidate>
            <div class="field">
                <label for="newPassword">Новый пароль <span class="req">*</span></label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
                <div class="hint">Не короче 8 символов, хотя бы одна буква и одна цифра, без пробелов.</div>
            </div>
            <div class="field">
                <label for="confirm">Повторите пароль <span class="req">*</span></label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Сохранить пароль</button>
        </form>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    const token = FindSport.param('token');
    if (!token) {
        FindSport.show(alertBox, 'В ссылке нет токена. Запросите восстановление доступа еще раз.', 'error');
        form.classList.add('hidden');
    }
    FindSport.bindForm(form, alertBox, async data => {
        if (data.get('newPassword') !== data.get('confirm')) {
            throw Object.assign(new Error('Пароли не совпадают'),
                {problem: {errors: [{field: 'confirm', message: 'Пароли не совпадают'}]}});
        }
        await FindSport.post('/api/v1/auth/password/reset', {token, newPassword: data.get('newPassword')});
        window.location.replace('/login.html?reset=1');
    });
</script>
</body>
</html>
