<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — FindSport</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/account.html"><span class="logo-mark">F.</span><span class="logo-text">Find<span>Sport</span></span></a><nav><a href="/login.html">Вход</a><a href="/register.html">Регистрация</a></nav></div></header>
<main class="auth">
    <h1>Регистрация</h1>
    <p class="lead">После регистрации мы отправим письмо для подтверждения e-mail.</p>
    <div class="card">
        <div id="alert" class="alert hidden" role="alert"></div>
        <form id="form" novalidate>
            <div class="field">
                <label>Тип учетной записи <span class="req">*</span></label>
                <div class="radio-group" data-error-for="accountTypeAllowed">
                    <label><input type="radio" name="accountType" value="USER" checked> Пользователь</label>
                    <label><input type="radio" name="accountType" value="PROVIDER"> Организация или тренер</label>
                </div>
            </div>
            <div class="field">
                <label for="displayName">Имя или отображаемое имя</label>
                <input id="displayName" name="displayName" type="text" maxlength="100" autocomplete="name">
            </div>
            <div class="field">
                <label for="email">E-mail <span class="req">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Пароль <span class="req">*</span></label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <div class="hint">Не короче 8 символов, хотя бы одна буква и одна цифра, без пробелов.</div>
            </div>
            <label class="check"><input type="checkbox" name="termsAccepted">
                <span>Принимаю <a href="#" title="Раздел «Пользовательское соглашение»">пользовательское соглашение</a> <span class="req">*</span></span></label>
            <label class="check"><input type="checkbox" name="privacyPolicyAccepted">
                <span>Даю согласие на обработку персональных данных в соответствии с
                    <a href="#" title="Раздел «Политика обработки персональных данных»">политикой обработки ПД</a> <span class="req">*</span></span></label>
            <button class="btn btn-primary btn-block" type="submit">Зарегистрироваться</button>
        </form>
        <div class="actions"><span class="muted">Уже зарегистрированы? <a href="/login.html">Войти</a></span></div>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    FindSport.bindForm(form, alertBox, async data => {
        const result = await FindSport.post('/api/v1/auth/register', {
            email: data.get('email'),
            password: data.get('password'),
            displayName: data.get('displayName'),
            accountType: data.get('accountType'),
            termsAccepted: data.get('termsAccepted') === 'on',
            privacyPolicyAccepted: data.get('privacyPolicyAccepted') === 'on'
        });
        form.reset();
        form.classList.add('hidden');
        FindSport.show(alertBox, result.message, 'success');
    });
</script>
</body>
</html>
