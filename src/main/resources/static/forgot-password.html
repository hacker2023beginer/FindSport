<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Восстановление доступа — FindSport</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/account.html"><span class="logo-mark">F.</span><span class="logo-text">Find<span>Sport</span></span></a><nav><a href="/login.html">Вход</a><a href="/register.html">Регистрация</a></nav></div></header>
<main class="auth">
    <h1>Восстановление доступа</h1>
    <p class="lead">Укажите e-mail учетной записи — мы пришлем ссылку для установки нового пароля.</p>
    <div class="card">
        <div id="alert" class="alert hidden" role="alert"></div>
        <form id="form" novalidate>
            <div class="field">
                <label for="email">E-mail <span class="req">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Отправить ссылку</button>
        </form>
        <div class="actions"><a href="/login.html">Вернуться ко входу</a></div>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    FindSport.bindForm(form, alertBox, async data => {
        const result = await FindSport.post('/api/v1/auth/password/forgot', {email: data.get('email')});
        FindSport.show(alertBox, result.message, 'success');
    });
</script>
</body>
</html>
