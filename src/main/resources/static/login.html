<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — FindSport</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/account.html"><span class="logo-mark">F.</span><span class="logo-text">Find<span>Sport</span></span></a><nav><a href="/login.html">Вход</a><a href="/register.html">Регистрация</a></nav></div></header>
<main class="auth">
    <h1>Вход</h1>
    <p class="lead">Войдите, чтобы подавать заявки и управлять профилем.</p>
    <div class="card">
        <div id="alert" class="alert hidden" role="alert"></div>
        <div id="resend" class="alert alert-info hidden">
            Не пришло письмо? <a href="#" id="resend-link">Отправить повторно</a>
        </div>
        <form id="form" novalidate>
            <div class="field">
                <label for="email">E-mail <span class="req">*</span></label>
                <input id="email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Пароль <span class="req">*</span></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Войти</button>
        </form>
        <div class="actions">
            <a href="/forgot-password.html">Забыли пароль?</a>
            <span class="muted">Нет учетной записи? <a href="/register.html">Зарегистрируйтесь</a></span>
        </div>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    const resend = document.getElementById('resend');
    if (FindSport.param('verified')) {
        FindSport.show(alertBox, 'E-mail подтвержден. Теперь можно войти.', 'success');
    }
    if (FindSport.param('reset')) {
        FindSport.show(alertBox, 'Пароль изменен. Войдите с новым паролем.', 'success');
    }
    FindSport.bindForm(form, alertBox, async data => {
        resend.classList.add('hidden');
        try {
            await FindSport.post('/api/v1/auth/login', {email: data.get('email'), password: data.get('password')});
            window.location.href = '/account.html';
        } catch (error) {
            if (error.problem.reason === 'EMAIL_NOT_VERIFIED') {
                resend.classList.remove('hidden');
            }
            if (error.problem.lockedUntil) {
                const until = new Date(error.problem.lockedUntil)
                    .toLocaleTimeString('ru-RU', {timeZone: 'Europe/Minsk', hour: '2-digit', minute: '2-digit'});
                error.message += ` Вход станет доступен после ${until}.`;
            }
            throw error;
        }
    });
    document.getElementById('resend-link').addEventListener('click', async event => {
        event.preventDefault();
        try {
            const result = await FindSport.post('/api/v1/auth/email-verification/resend',
                {email: form.email.value});
            FindSport.show(alertBox, result.message, 'info');
            resend.classList.add('hidden');
        } catch (error) {
            FindSport.showError(form, alertBox, error);
        }
    });
</script>
</body>
</html>
