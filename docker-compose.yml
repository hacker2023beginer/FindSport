# Инфраструктура локальной разработки FindSport: PostgreSQL и тестовый почтовый сервер.
# Параметры БД совпадают с src/main/resources/application.yml.
# Запуск:  docker compose up -d    Остановка (данные сохраняются):  docker compose down

services:
  postgres:
    image: postgres:17-alpine
    container_name: findsport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-findsport}
      POSTGRES_USER: ${DB_USERNAME:-findsport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-findsport_dev}
      TZ: Europe/Minsk
      PGTZ: Europe/Minsk
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - findsport-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SMTP-заглушка для писем подтверждения e-mail и восстановления доступа.
  # Письма не уходят наружу; просмотр — http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: findsport-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"

volumes:
  findsport-pgdata:
    name: findsport-pgdata
